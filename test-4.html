<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Left Tooltip</title>
        <style>
            :root {
                --my-primary-color: #1f2937;
                --fs-xs: 12px;
            }

            body {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                background: #f3f4f6;
            }

            /* Tooltip wrapper */
            .tooltip {
                position: relative;
                display: inline-block;
                cursor: pointer;
            }

            /* Icon */
            .tooltip-icon {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2563eb;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                transition: transform 0.3s ease;
            }

            .tooltip-icon:hover {
                transform: scale(1.1);
            }

            /* Tooltip box */
            .tooltip-text {
                position: absolute;
                right: 100%;
                top: 50%;
                transform: translateY(-50%) translateX(12px);
                background: var(--my-primary-color);
                color: #fff;
                padding: 12px;
                border-radius: 8px;
                font-size: var(--fs-xs);
                width: 180px;
                text-align: center;

                opacity: 0;
                visibility: hidden;
                transition: all 0.35s ease;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                z-index: 10;
            }

            /* Arrow */
            .tooltip-text::after {
                content: '';
                position: absolute;
                left: 100%;
                top: 50%;
                transform: translateY(-50%);
                border: 8px solid transparent;
                border-left-color: var(--my-primary-color);
            }

            /* Hover show */
            .tooltip:hover .tooltip-text {
                opacity: 1;
                visibility: visible;
                transform: translateY(-50%) translateX(0);
            }
        </style>
    </head>

    <body>

        <div class="tooltip-left">
            <div class="tooltip-icon">?</div>
            <div class="tooltip-text">
                This tooltip appears from the left side smoothly.
            </div>
        </div>

    </body>

</html>
