<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Directional Hover Card</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #f0f0f0;
            }

            .event-cart {
                width: 300px;
                height: 500px;
                padding: 16px;
                border-radius: 24px;
                background-color: #fff;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                transition: transform 0.3s ease;
                transform-style: preserve-3d;
                cursor: pointer;
            }
        </style>
    </head>

    <body>

        <div class="event-cart">
            <h2>Event Title</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <p>Date: 10 Feb 2026</p>
        </div>

        <script>
            const card = document.querySelector('.event-cart');

            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Determine which side the cursor is on
                const sideX = x < rect.width / 2 ? -1 : 1; // left = -1, right = 1
                const sideY = y < rect.height / 2 ? -1 : 1; // top = -1, bottom = 1

                const rotateX = 5 * sideY; // tilt forward/backward
                const rotateY = 5 * sideX; // tilt left/right

                card.style.transform = `perspective(250px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.96)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(250px) rotateX(0deg) rotateY(0deg) scale(1)';
            });
        </script>

    </body>

</html>
