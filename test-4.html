<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nested Swiper</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                padding: 40px;
                background: #f5f5f5;
            }

            /* MAIN SLIDER */
            .main-slider {
                width: 100%;
            }

            .main-slider .swiper-slide {
                background: #fff;
                border-radius: 12px;
                padding: 15px;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            }

            /* CARD IMAGE SLIDER */
            .inner-slider {
                width: 100%;
                height: 200px;
                border-radius: 10px;
                overflow: hidden;
            }

            .inner-slider img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .card-content {
                margin-top: 10px;
            }

            .swiper-button-next,
            .swiper-button-prev {
                color: #000;
            }
        </style>
    </head>

    <body>

        <!-- MAIN SLIDER -->
        <div class="swiper main-slider">
            <div class="swiper-wrapper">

                <!-- CARD 1 -->
                <div class="swiper-slide">
                    <div class="swiper inner-slider">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?1"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?2"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?3"></div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3>Card 1</h3>
                        <p>Description here</p>
                    </div>
                </div>

                <!-- CARD 2 -->
                <div class="swiper-slide">
                    <div class="swiper inner-slider">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?4"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?5"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?6"></div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3>Card 2</h3>
                        <p>Description here</p>
                    </div>
                </div>

                <!-- CARD 3 -->
                <div class="swiper-slide">
                    <div class="swiper inner-slider">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?7"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?8"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?9"></div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3>Card 3</h3>
                        <p>Description here</p>
                    </div>
                </div>

                <!-- CARD 4 -->
                <div class="swiper-slide">
                    <div class="swiper inner-slider">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?10"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?11"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/200?12"></div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3>Card 4</h3>
                        <p>Description here</p>
                    </div>
                </div>

            </div>

            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

        <script>
            // MAIN SLIDER (3 cards visible)
            new Swiper(".main-slider", {
                slidesPerView: 3,
                spaceBetween: 20,
                loop: true,
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                breakpoints: {
                    0: { slidesPerView: 1 },
                    768: { slidesPerView: 2 },
                    1024: { slidesPerView: 3 }
                }
            });

            // INNER SLIDERS
            document.querySelectorAll(".inner-slider").forEach((slider) => {
                new Swiper(slider, {
                    slidesPerView: 1,
                    loop: true,
                    autoplay: {
                        delay: 2000,
                        disableOnInteraction: false
                    }
                });
            });
        </script>

    </body>

</html>
