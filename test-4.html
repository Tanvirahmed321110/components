<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Wave Button Hover Effect</title>
        <style>
            :root {
                --my-primary-color: #2563eb;
                --my-secondary-color: #22c55e;
                --my-white: #ffffff;
            }

            body {
                font-family: Arial, sans-serif;
                background: #0f172a;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .btn-wrapper {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }

            /* Base button */
            .my-btn {
                position: relative;
                /* overflow: hidden; */
                padding: 16px 36px;
                font-size: 16px;
                font-weight: 600;
                color: var(--my-white);
                background: transparent;
                border: 2px solid currentColor;
                border-radius: 12px;
                cursor: pointer;
                z-index: 1;
            }

            /* wave layer */
            .my-btn::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: -100%;
                width: 180%;
                height: 300%;
                transform: translateX(-50%) scaleY(0);
                transform-origin: bottom;
                border-radius: 50%;
                transition: transform 0.5s cubic-bezier(.66, 0, .34, 1),
                    bottom 0.7s cubic-bezier(.66, 0, .34, 1);
                z-index: 2;
            }

            /* hover wave */
            .my-btn:hover::after {
                transform: translateX(-50%) scaleY(1);
                bottom: -18%;
                color: var(--my-primary-color);
                background-color: var(--my-primary-color);
            }

            /* Button variations */
            .primary-btn {
                color: var(--my-primary-color);
            }

            .primary-btn::after {
                background-color: var(--my-primary-color);
            }

            .secondary-btn {
                color: var(--my-secondary-color);
            }

            .secondary-btn::after {
                background-color: var(--my-secondary-color);
            }

            .outline-btn {
                color: #f97316;
            }

            .outline-btn::after {
                background-color: #f97316;
            }

            .dark-btn {
                color: #e5e7eb;
                border-color: #e5e7eb;
            }

            .dark-btn::after {
                background-color: #334155;
            }

            /* text color change on hover */
            .my-btn:hover {
                color: #ffffff;
            }
        </style>
    </head>

    <body>

        <div class="btn-wrapper">

            <!-- Example 1 -->
            <button class="my-btn primary-btn">
                Primary Wave
            </button>

            <!-- Example 2 -->
            <button class="my-btn secondary-btn">
                Secondary Wave
            </button>

            <!-- Example 3 -->
            <button class="my-btn outline-btn">
                Orange Wave
            </button>

            <!-- Example 4 -->
            <button class="my-btn dark-btn">
                Dark Wave
            </button>

        </div>

    </body>

</html>
