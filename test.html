<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Complex Flex Layout</title>
        <style>
            /* ===============================
   FLEX UTILITIES
================================ */
            .my-d-flex {
                display: flex;
            }

            .my-flex-wrap {
                flex-wrap: wrap;
            }

            .my-justify-start {
                justify-content: flex-start;
            }

            .my-justify-center {
                justify-content: center;
            }

            .my-justify-end {
                justify-content: flex-end;
            }

            .my-justify-between {
                justify-content: space-between;
            }

            .my-align-start {
                align-items: flex-start;
            }

            .my-align-center {
                align-items: center;
            }

            .my-align-end {
                align-items: flex-end;
            }

            .my-align-stretch {
                align-items: stretch;
            }

            .flex-1 {
                flex: 1;
            }

            /* ===============================
   GRID SYSTEM
================================ */
            [class*="col-"] {
                padding: 8px;
                /* optional gap */
                box-sizing: border-box;
            }

            .col-1 {
                flex: 0 0 8.333%;
                max-width: 8.333%;
            }

            .col-2 {
                flex: 0 0 16.666%;
                max-width: 16.666%;
            }

            .col-3 {
                flex: 0 0 25%;
                max-width: 25%;
            }

            .col-4 {
                flex: 0 0 33.333%;
                max-width: 33.333%;
            }

            .col-5 {
                flex: 0 0 41.666%;
                max-width: 41.666%;
            }

            .col-6 {
                flex: 0 0 50%;
                max-width: 50%;
            }

            .col-8 {
                flex: 0 0 66.666%;
                max-width: 66.666%;
            }

            .col-12 {
                flex: 0 0 100%;
                max-width: 100%;
            }

            /* ===============================
   DEMO COLORS & SPACING
================================ */
            .my-bg-red {
                background: #e63946;
                color: #fff;
            }

            .my-bg-blue {
                background: #457b9d;
                color: #fff;
            }

            .my-bg-gray {
                background: #e5e5e5;
            }

            .my-bg-green {
                background: #2a9d8f;
                color: #fff;
            }

            .my-p-2 {
                padding: 16px;
            }

            .my-pl-2 {
                padding-left: 16px;
            }

            .my-pr-2 {
                padding-right: 16px;
            }

            .my-fs-lg {
                font-size: 20px;
            }

            .my-fw-bold {
                font-weight: bold;
            }

            /* ===============================
   BUTTON
================================ */
            .button {
                padding: 10px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                color: #fff;
            }

            .button-red {
                background: #e63946;
            }

            .button-blue {
                background: #1d3557;
            }

            .button-green {
                background: #2a9d8f;
            }

            /* ===============================
   CARD STYLE (optional)
================================ */
            .card {
                border-radius: 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .my-d-flex {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                align-items: stretch;
                /* ensures both columns same height */
            }

            .left,
            .right {
                flex: 0 0 calc(50% - 16px);
                /* 50% width minus gap */
                display: flex;
                flex-direction: column;
            }

            .wrap {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .text {
                display: flex;
                flex: 1;
                /* take full height of .wrap */
                align-items: center;
                /* vertical center */
                justify-content: center;
            }
        </style>
    </head>

    <body>

        <!-- ===============================
     COMPLEX FLEX LAYOUT
================================ -->

        <div class="my-d-flex my-flex-wrap my-justify-between my-align-stretch">

            <div class=" left col-6" style="background-color: rebeccapurple;">
                <div class="head">Head</div>
                <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias consequatur dolorum unde, impedit
                    sit molestiae, rem iusto incidunt corrupti animi perspiciatis maxime ipsam exercitationem excepturi
                    saepe expedita eveniet? Itaque, aliquam?</p>
                <button>Button</button>
            </div>

            <div class="right col-6" style="background-color: rgb(94, 89, 99);">
                <div class="wrap">
                    <div class="text " style="background-color: orange;">Text</div>
                </div>
            </div>

        </div>

    </body>

</html>
