<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>December 2025 & January 2026 Calendar</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f5f5f7;
                padding: 20px;
            }

            .container {
                width: 340px;
                background-color: white;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                overflow: hidden;
            }

            .calendar {
                padding: 20px;
            }

            .calendar:first-child {
                border-bottom: 1px solid #eaeaea;
            }

            .month-year {
                font-size: 18px;
                font-weight: 600;
                color: #1d1d1f;
                margin-bottom: 16px;
                text-align: center;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            thead th {
                font-size: 12px;
                font-weight: 500;
                color: #86868b;
                padding-bottom: 8px;
                text-align: center;
            }

            tbody td {
                text-align: center;
                padding: 8px 0;
                font-size: 14px;
                color: #1d1d1f;
                font-weight: 400;
            }

            tbody td.empty {
                color: transparent;
            }

            .separator {
                height: 1px;
                background-color: #eaeaea;
                margin: 0 20px;
            }

            .apply-button {
                display: block;
                width: 100%;
                padding: 16px;
                background-color: #007aff;
                color: white;
                border: none;
                font-size: 16px;
                font-weight: 500;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .apply-button:hover {
                background-color: #0056cc;
            }

            @media (max-width: 380px) {
                .container {
                    width: 100%;
                    max-width: 340px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="calendar">
                <div class="month-year">December 2025</div>
                <table>
                    <thead>
                        <tr>
                            <th>Su</th>
                            <th>Mo</th>
                            <th>Tu</th>
                            <th>We</th>
                            <th>Th</th>
                            <th>Fr</th>
                            <th>Sa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="empty"></td>
                            <td>1</td>
                            <td>2</td>
                            <td>3</td>
                            <td>4</td>
                            <td>5</td>
                            <td>6</td>
                        </tr>
                        <tr>
                            <td>7</td>
                            <td>8</td>
                            <td>9</td>
                            <td>10</td>
                            <td>11</td>
                            <td>12</td>
                            <td>13</td>
                        </tr>
                        <tr>
                            <td>14</td>
                            <td>15</td>
                            <td>16</td>
                            <td>17</td>
                            <td>18</td>
                            <td>19</td>
                            <td>20</td>
                        </tr>
                        <tr>
                            <td>21</td>
                            <td>22</td>
                            <td>23</td>
                            <td>24</td>
                            <td>25</td>
                            <td>26</td>
                            <td>27</td>
                        </tr>
                        <tr>
                            <td>28</td>
                            <td>29</td>
                            <td>30</td>
                            <td>31</td>
                            <td class="empty"></td>
                            <td class="empty"></td>
                            <td class="empty"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="separator"></div>

            <div class="calendar">
                <div class="month-year">January 2026</div>
                <table>
                    <thead>
                        <tr>
                            <th>Su</th>
                            <th>Mo</th>
                            <th>Tu</th>
                            <th>We</th>
                            <th>Th</th>
                            <th>Fr</th>
                            <th>Sa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="empty"></td>
                            <td class="empty"></td>
                            <td class="empty"></td>
                            <td class="empty"></td>
                            <td>1</td>
                            <td>2</td>
                            <td>3</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>5</td>
                            <td>6</td>
                            <td>7</td>
                            <td>8</td>
                            <td>9</td>
                            <td>10</td>
                        </tr>
                        <tr>
                            <td>11</td>
                            <td>12</td>
                            <td>13</td>
                            <td>14</td>
                            <td>15</td>
                            <td>16</td>
                            <td>17</td>
                        </tr>
                        <tr>
                            <td>18</td>
                            <td>19</td>
                            <td>20</td>
                            <td>21</td>
                            <td>22</td>
                            <td>23</td>
                            <td>24</td>
                        </tr>
                        <tr>
                            <td>25</td>
                            <td>26</td>
                            <td>27</td>
                            <td>28</td>
                            <td>29</td>
                            <td>30</td>
                            <td>31</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button class="apply-button">Apply</button>
        </div>

        <script>
            // Add today's date highlighting (optional feature)
            document.addEventListener('DOMContentLoaded', function () {
                // Get current date
                const today = new Date();
                const currentDay = today.getDate();
                const currentMonth = today.getMonth(); // 0-indexed (0 = January)
                const currentYear = today.getFullYear();

                // Check if current month/year matches either calendar
                const decemberCells = document.querySelectorAll('.calendar:first-child td');
                const januaryCells = document.querySelectorAll('.calendar:last-child td');

                // If current month is December 2025, highlight today
                if (currentYear === 2025 && currentMonth === 11) {
                    decemberCells.forEach(cell => {
                        if (parseInt(cell.textContent) === currentDay) {
                            cell.style.backgroundColor = '#007aff';
                            cell.style.color = 'white';
                            cell.style.borderRadius = '50%';
                            cell.style.width = '24px';
                            cell.style.height = '24px';
                            cell.style.display = 'inline-flex';
                            cell.style.alignItems = 'center';
                            cell.style.justifyContent = 'center';
                            cell.style.margin = '0 auto';
                        }
                    });
                }

                // If current month is January 2026, highlight today
                if (currentYear === 2026 && currentMonth === 0) {
                    januaryCells.forEach(cell => {
                        if (parseInt(cell.textContent) === currentDay) {
                            cell.style.backgroundColor = '#007aff';
                            cell.style.color = 'white';
                            cell.style.borderRadius = '50%';
                            cell.style.width = '24px';
                            cell.style.height = '24px';
                            cell.style.display = 'inline-flex';
                            cell.style.alignItems = 'center';
                            cell.style.justifyContent = 'center';
                            cell.style.margin = '0 auto';
                        }
                    });
                }

                // Add click event to Apply button
                document.querySelector('.apply-button').addEventListener('click', function () {
                    alert('Calendar applied! This is a demonstration of the Apply button functionality.');
                });
            });
        </script>
    </body>

</html>
