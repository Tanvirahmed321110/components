<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modal Gallery with Hidden View All Images</title>

        <!-- GLightbox CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />

        <style>
            body {
                background: #111;
                color: #fff;
                font-family: sans-serif;
                padding: 20px;
            }

            .modal {
                position: relative;
                background: #222;
                padding: 16px;
                margin-bottom: 50px;
                border-radius: 12px;
            }

            /* Flex layout for gallery */
            .image-gallery {
                display: flex;
                gap: 24px;
                width: 100%;
                height: 282px;
                position: relative;
            }

            /* Left side */
            .gallery-left {
                width: 40%;
                display: flex;
            }

            .gallery-left .item {
                flex: 1;
                overflow: hidden;
                border-radius: 12px;
            }

            /* Right side */
            .gallery-right {
                width: 60%;
                display: flex;
                gap: 24px;
            }

            /* Right column left */
            .gallery-right .left {
                width: 45%;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .gallery-right .left .top,
            .gallery-right .left .bottom {
                flex: 1;
                overflow: hidden;
                border-radius: 12px;
            }

            /* Right column right */
            .gallery-right .right {
                width: 55%;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .gallery-right .right .top,
            .gallery-right .right .bottom {
                flex: 1;
                overflow: hidden;
                border-radius: 12px;
            }

            /* Images */
            .image-gallery img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            /* View All / Total Img button */
            .view-all,
            .total-img {
                position: absolute;
                bottom: 12px;
                right: 12px;
                padding: 6px 12px;
                border-radius: 6px;
                color: #fff;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(4px);
                border: 1px solid rgba(255, 255, 255, 0.35);
                cursor: pointer;
                font-size: 12px;
            }

            /* Hidden container for View All images */
            .view-all-image {
                display: none;
            }
        </style>
    </head>

    <body>

        <!-- ================= Modal 1 ================= -->
        <div class="modal" id="modal1">
            <h3>Gallery 1</h3>
            <div class="image-gallery">
                <div class="gallery-left">
                    <div class="item">
                        <img src="https://i.ibb.co.com/ZZgJGYQ/car1.png" alt="">
                    </div>
                </div>
                <div class="gallery-right">
                    <div class="left">
                        <div class="top item"><img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt=""></div>
                        <div class="bottom item"><img src="https://i.ibb.co.com/JFgBcCZX/car3.jpg" alt=""></div>
                    </div>
                    <div class="right">
                        <div class="top item">
                            <img src="https://i.ibb.co.com/97JM2Dr/car4.jpg" alt="">
                            <button class="total-img">34</button>
                        </div>
                        <div class="bottom item">
                            <img src="https://i.ibb.co.com/97JM2Dr/car4.jpg" alt="">
                            <button class="view-all">View All</button>
                        </div>
                    </div>
                </div>

                <!-- Hidden container specific to this modal -->
                <div class="view-all-image">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                </div>
            </div>
        </div>

        <!-- ================= Modal 2 ================= -->
        <div class="modal" id="modal2">
            <h3>Gallery 2</h3>
            <div class="image-gallery">
                <div class="gallery-left">
                    <div class="item"><img src="https://i.ibb.co.com/ZZgJGYQ/car1.png" alt=""></div>
                </div>
                <div class="gallery-right">
                    <div class="left">
                        <div class="top item"><img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt=""></div>
                        <div class="bottom item"><img src="https://i.ibb.co.com/JFgBcCZX/car3.jpg" alt=""></div>
                    </div>
                    <div class="right">
                        <div class="top item"><img src="https://i.ibb.co.com/97JM2Dr/car4.jpg" alt=""></div>
                        <div class="bottom item">
                            <img src="https://i.ibb.co.com/97JM2Dr/car4.jpg" alt="">
                            <button class="view-all">View All</button>
                        </div>
                    </div>
                </div>

                <!-- Hidden container specific to this modal -->
                <div class="view-all-image">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                    <img src="https://i.ibb.co.com/S4dk0z3R/car2.jpg" alt="">
                </div>
            </div>
        </div>

        <!-- ================= GLightbox JS ================= -->
        <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
        <script>
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.view-all, .total-img');
                if (!btn) return;

                const gallery = btn.closest('.image-gallery');
                if (!gallery) return;

                // hidden container inside this gallery
                const container = gallery.querySelector('.view-all-image');
                if (!container) return;

                // destroy previous lightbox if exists
                if (window.galleryLightbox) window.galleryLightbox.destroy();

                // initialize GLightbox with only hidden images
                window.galleryLightbox = GLightbox({
                    elements: [...container.querySelectorAll('img')].map(img => ({
                        href: img.src,
                        type: 'image'
                    })),
                    loop: true
                });

                window.galleryLightbox.open();
            });

        </script>

    </body>

</html>
