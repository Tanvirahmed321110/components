<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Component</title>
        <link rel="stylesheet" href="static/css/global_css/global.css">
        <link rel="stylesheet" href="static/css/library/custom_class.css">
        <link rel="stylesheet" href="static/css/library/my_component.css">

        <style>
            .component-sec {
                border: 2px solid #ededed;
                padding: 24px;
                border-radius: 12px;
                position: relative;
            }

            main {
                margin: 24px 0;
            }

            .com-title {
                position: absolute;
                top: -24px;
                left: 16px;
                background-color: white;
                padding: 4px 16px;
                color: var(--my-text-primary);
            }

            section {
                margin-bottom: 48px;
            }
        </style>
    </head>

    <body>
        <main>

            <!--============================||  For Alert  ||============================-->
            <section class="">
                <div class="my-container">
                    <div class="component-sec">
                        <h2 class="com-title">Alert</h2>

                        <div class="my-grid-3 my-gap-8 my-mt-6">
                            <div class="my-alert alert-warning my-my-2">Alert Warning</div>
                            <div class="my-alert alert-danger my-my-2">Alert Danger</div>
                            <div class="my-alert alert-primary my-my-2">Alert Primary</div>
                        </div>
                    </div>
                </div>
            </section>

            <!--============================||  For Alert  ||============================-->
            <section class="">
                <div class="my-container">
                    <div class="component-sec">
                        <h2 class="com-title">Buttons</h2>

                        <div class="my-d-flex flex-wrap my-gap-16 my-mt-6">
                            <button class="my-btn my-primary-btn"><span class="content">Primary Btn</span></button>
                            <button class="my-btn my-secondary-btn"><span class="content">Secondary
                                    Btn</span></button>
                            <button class="my-btn my-outline-btn"><span class="content">Outline Btn</span></button>
                            <div>
                                <button class="my-btn my-btn-pill "><span class="content">Pill
                                        Btn</span></button>
                            </div>
                            <div>
                                <button class="my-btn my-btn-pill my-primary-btn "><span class="content">Pill
                                        Btn</span></button>
                            </div>
                            <div>
                                <button class="my-btn my-btn-pill my-secondary-btn "><span class="content">Pill
                                        Btn</span></button>
                            </div>
                            <div>
                                <button class="my-btn my-btn-sm"><span class="content">Outline sm</span></button>
                            </div>
                            <div>
                                <button class="my-btn my-btn-sm my-primary-btn"><span class="content">Primary
                                        SM</span></button>
                            </div>
                            <div>
                                <button class="my-btn my-btn-sm my-secondary-btn"><span class="content">Secondary
                                        SM</span></button>
                            </div>
                            <div class="my-flex-center ">
                                <button class="my-btn my-primary-btn section-btn">
                                    <span class="content">
                                        Section Button
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!--============================||  For Alert  ||============================-->
            <section class="">
                <div class="my-container">
                    <div class="component-sec">
                        <h2 class="com-title">Inputs</h2>

                        <div class="my-grid-6 my-gap-8 my-mt-6">
                            <div class="search-input my-input-control mobile-hide">
                                <input type="text" placeholder="Search in Map" aria-label="Search">
                                <span>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M17 17L21 21" stroke="#FC5A31" stroke-width="1.5"
                                            stroke-linecap="round" stroke-linejoin="round"></path>
                                        <path
                                            d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"
                                            stroke="#FC5A31" stroke-width="1.5" stroke-linecap="round"
                                            stroke-linejoin="round"></path>
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>

</html>
