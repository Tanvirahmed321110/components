<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Custom Dropdown with Label Click</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            * {
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            body {
                background: #f4f6f8;
                padding: 40px;
            }

            .form-wrapper {
                max-width: 420px;
                margin: auto;
                background: #fff;
                padding: 24px;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            }

            .my-input-control {
                position: relative;
                margin-bottom: 24px;
            }

            .label {
                display: inline-block;
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #333;
                cursor: pointer;
            }

            /* Selected box */
            .dropdown-selected {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 14px;
                border: 1px solid #ccc;
                border-radius: 8px;
                cursor: pointer;
                background: #fff;
            }

            .dropdown-selected span {
                color: #444;
            }

            .arrow-icon {
                width: 8px;
                height: 8px;
                border-right: 2px solid #555;
                border-bottom: 2px solid #555;
                transform: rotate(45deg);
                transition: .25s ease;
            }

            /* Options */
            .dropdown-options {
                position: absolute;
                width: 100%;
                top: calc(100% + 6px);
                background: #fff;
                border-radius: 8px;
                border: 1px solid #ddd;
                list-style: none;
                padding: 6px 0;
                margin: 0;
                display: none;
                z-index: 20;
                max-height: 200px;
                overflow-y: auto;
            }

            .dropdown-options li {
                padding: 10px 14px;
                cursor: pointer;
                transition: background .2s;
            }

            .dropdown-options li:hover {
                background: #f1f1f1;
            }

            /* Active */
            .custom-dropdown.active .dropdown-options {
                display: block;
            }

            .custom-dropdown.active .arrow-icon {
                transform: rotate(-135deg);
            }

            /* Error */
            .error-message {
                display: none;
                font-size: 12px;
                color: #d93025;
                margin-top: 6px;
            }

            .custom-dropdown.error .dropdown-selected {
                border-color: #d93025;
            }

            .custom-dropdown.error .error-message {
                display: block;
            }
        </style>
    </head>

    <body>

        <div class="form-wrapper">

            <!-- Dropdown 1 -->
            <div class="my-input-control custom-dropdown">
                <label class="label">Title</label>

                <div class="dropdown-selected">
                    <span>Select Title</span>
                    <div class="arrow-icon"></div>
                </div>

                <ul class="dropdown-options">
                    <li data-value="1">Title One</li>
                    <li data-value="2">Title Two</li>
                    <li data-value="3">Title Three</li>
                </ul>

                <input type="hidden" name="title">
                <small class="error-message">Please select a title</small>
            </div>

            <!-- Dropdown 2 -->
            <div class="my-input-control custom-dropdown">
                <label class="label">Category</label>

                <div class="dropdown-selected">
                    <span>Select Category</span>
                    <div class="arrow-icon"></div>
                </div>

                <ul class="dropdown-options">
                    <li data-value="family">Family</li>
                    <li data-value="business">Business</li>
                    <li data-value="other">Other</li>
                </ul>

                <input type="hidden" name="category">
                <small class="error-message">Please select a category</small>
            </div>

        </div>

        <script>
            document.querySelectorAll('.custom-dropdown').forEach(dropdown => {
                const selected = dropdown.querySelector('.dropdown-selected');
                const label = dropdown.querySelector('.label');
                const options = dropdown.querySelectorAll('.dropdown-options li');
                const hiddenInput = dropdown.querySelector('input[type="hidden"]');
                const text = selected.querySelector('span');

                function toggleDropdown() {
                    document.querySelectorAll('.custom-dropdown').forEach(d => {
                        if (d !== dropdown) d.classList.remove('active');
                    });
                    dropdown.classList.toggle('active');
                }

                selected.addEventListener('click', e => {
                    e.stopPropagation();
                    toggleDropdown();
                });

                label.addEventListener('click', e => {
                    e.stopPropagation();
                    toggleDropdown();
                });

                options.forEach(option => {
                    option.addEventListener('click', () => {
                        text.textContent = option.textContent;
                        hiddenInput.value = option.dataset.value;
                        dropdown.classList.remove('active');
                        dropdown.classList.remove('error');
                    });
                });
            });

            // Close on outside click
            document.addEventListener('click', () => {
                document.querySelectorAll('.custom-dropdown').forEach(d => {
                    d.classList.remove('active');
                });
            });
        </script>

    </body>

</html>
