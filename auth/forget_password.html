<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
        <link rel="stylesheet" href="./static/css/library/custom_class.css">
        <link rel="stylesheet" href="./static/css/library/my_component.css">
        <link rel="stylesheet" href="../static/css/global_css/global.css">
        <link rel="stylesheet" href="../static/css/library/custom_class.css">
        <link rel="stylesheet" href="../static/css/library/my_component.css">
        <link rel="stylesheet" href="../static/css/pages/auth.css">
    </head>

    <body class=" my-flex-center">
        <main class="my-flex-center ">
            <section class="auth my-flex-center forget">
                <div class="auth-wrapper my-flex-between my-align-stretch my-gap-24">
                    <!--===================|| Left Content  ||==================== -->
                    <div class=" content  my-p-12 flex-1">

                        <form action="#">

                            <!-- top -->
                            <div class="my-flex-center my-flex-column top">
                                <img class="my-w-75" src="/static/images/Logo.svg" alt="logo" loading="lazy">
                                <h1 class="my-fs-xxl my-fs-sm-xl my-text-primary my-mt-4">Forget Password</h1>
                            </div>

                            <!-- input -->
                            <div class="my-mt-16 my-mt-sm-8 my-flex-column my-gap-8">
                                <!-- for email -->
                                <div class="my-input-control">
                                    <label for="">Eamil Address / Phone</label>
                                    <input type="text" class="my-mt-4" placeholder="Enter your email/phone">
                                    <div class="error-message">Error</div>
                                </div>

                                <!-- for Password -->
                                <!-- <div class="my-input-control toggle-password">
                                    <label for="">Password</label>
                                    <input type="password" class="my-mt-4" placeholder="Minimum 8 characters">
                                    <div class="right-icon"><i class="ri-eye-line"></i></div>
                                    <div class="error-message">Error</div>
                                </div> -->

                                <!-- login button -->
                                <button class="my-btn my-primary-btn my-w-100-p my-mt-8 submit-btn"><span
                                        class="content">Send </span>
                                </button>
                                <!-- login button -->
                                <button class="my-btn  my-outline-btn my-w-100-p my-mt-8 submit-btn"
                                    style="padding: 11px;"><span class="content">Back To Home </span>
                                </button>
                            </div>
                        </form>


                        <div class="bottom my-mt-16 my-flex-center">
                            <div class="my-text-gray-2 my-fs-sm-xs">Don't have an account? <a href="/auth/register.html"
                                    class="my-secondary-color my-fw-bold my-fs-sm-xs">Create
                                    Account</a></div>
                        </div>
                    </div>

                    <!--===================|| Image Slider  ||==================== -->
                    <div class="images flex-1 my-d-flex ">
                        <div class="item my-p-relative flex-1 my-d-flex">

                            <!-- bg image -->
                            <div class="item-bg flex-1">
                                <img src="/static/images/forget.png" loading="lazy" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>



        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script src="/static/js/global_js/global.js"></script>
        <script>
            const authSlider = new Swiper(".authSlider", {
                loop: true,
                spaceBetween: 12,
                speed: 1500,
                autoplay: {
                    delay: 3400,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
            });
        </script>
    </body>

</html>
